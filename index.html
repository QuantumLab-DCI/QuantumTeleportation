<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teletransportación cuántica</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" integrity="sha384-5TcZemv2l/9On385z///+d7MSYlvIEw9FuZTIdZ14vJLqWphw7e7ZPuOiCHJcFCP" crossorigin="anonymous">
  </head>
  <body>
    <header class="site-header">
      <h1>Teletransportación cuántica</h1>
      <nav aria-label="Secciones de la página">
        <a href="#context">Contexto</a>
        <a href="#quantum-challenge">Desafío cuántico</a>
        <a href="#teleportation">Teletransportación</a>
        <a href="#study-box" data-tab-target="example-panel">Ejemplo</a>
        <a href="#study-box" data-tab-target="math-panel">Matemáticas</a>
        <a href="#study-box" data-tab-target="code-panel">Código</a>
      </nav>
    </header>

    <main>
      <div id="context-mount" class="mount-point"></div>

      <section id="study-box" class="study-box" aria-label="Materiales de estudio sobre teletransportación">
        <div class="tab-strip" role="tablist" aria-label="Vistas de estudio">
          <button id="example-tab" type="button" role="tab" aria-selected="true" aria-controls="example-panel" tabindex="0" data-tab-target="example-panel">Ejemplo</button>
          <button id="math-tab" type="button" role="tab" aria-selected="false" aria-controls="math-panel" tabindex="-1" data-tab-target="math-panel">Matemáticas</button>
          <button id="code-tab" type="button" role="tab" aria-selected="false" aria-controls="code-panel" tabindex="-1" data-tab-target="code-panel">Código</button>
        </div>
        <div id="example-mount" class="mount-point"></div>
        <div id="math-mount" class="mount-point"></div>
        <div id="code-mount" class="mount-point"></div>
      </section>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
